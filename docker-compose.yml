version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "8000:8000"
    environment:
      - BACKEND_HOST=0.0.0.0
      - BACKEND_PORT=8000
      - ENVIRONMENT=development
      - LLM_API_KEY=${LLM_API_KEY}
    volumes:
      - ./backend:/app/backend
      - ./logs:/app/logs
    command: python -m backend.main
    networks:
      - betting-network

networks:
  betting-network:
    driver: bridge
